name: Secrets policy

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sops-policy:
    name: SOPS policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Только структурная проверка: нет sops, ключа age, расшифровки и токенов.
    steps:
      - name: Получить публичные файлы
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Подготовить Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Установить инструменты
        run: python -m pip install --requirement requirements-dev.txt
      - name: Запустить тесты политики
        run: python -m unittest discover -s scripts/secrets/tests -v
      - name: Проверить зашифрованные файлы
        run: python scripts/secrets/check_sops.py
